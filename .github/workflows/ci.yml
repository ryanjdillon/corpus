name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[test]'

      - name: Unit tests
        run: pytest -q

      # ubuntu-latest runners ship a running Docker daemon, so the Docker-SDK
      # fixtures (pgvector, GreenMail) work here.
      - name: Integration tests
        run: pytest -q -m integration
