name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        # Pin to the same ruff as pyproject's dev extra so `just check` locally
        # matches CI exactly.
        with:
          version: "0.16.4"

  # Stdlib-only and diff-scoped, so it needs neither setup-python nor an install
  # step; it adds a couple of seconds to a ~2 minute run.
  architecture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate diffs against the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Architecture drift gate
        run: python3 scripts/architecture_gate.py "origin/${{ github.base_ref }}"

  # Lints and renders the chart and checks its output, as `just helm-check` does.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.2
      - name: Lint, render and check the chart
        run: bash deploy/helm/scripts/check.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # The same pins the image installs, so CI tests what ships. corpus-detect is
      # named in the same install so pip takes it from the repo, never an index.
      - name: Install
        run: pip install -c deploy/constraints.txt -e ./packages/detect -e '.[test]'

      # ubuntu-latest runners ship a running Docker daemon, so the Docker-SDK
      # fixtures (pgvector, GreenMail) run here. Clearing addopts includes the
      # integration tier alongside the unit tests in one coverage run.
      - name: Tests with coverage (unit + integration)
        # Measures corpus and corpus_detect ([tool.coverage.run] source).
        run: coverage run -m pytest -o addopts= tests packages/detect/tests
        # A native crash prints its C-level Python stack instead of a bare exit 139.
        env:
          PYTHONFAULTHANDLER: "1"

      - name: Coverage report
        run: coverage report --precision=2

      - name: Coverage ratchet
        run: |
          current=$(coverage report --format=total --precision=2)
          python scripts/coverage_gate.py "$current" .github/coverage-baseline.txt
