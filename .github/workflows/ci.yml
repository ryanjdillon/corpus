name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        # Pin to the same ruff as pyproject's dev extra so `just check` locally
        # matches CI exactly.
        with:
          version: "0.16.4"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[test]'

      # ubuntu-latest runners ship a running Docker daemon, so the Docker-SDK
      # fixtures (pgvector, GreenMail) run here. Clearing addopts includes the
      # integration tier alongside the unit tests in one coverage run.
      - name: Tests with coverage (unit + integration)
        run: coverage run --source=corpus -m pytest -o addopts= tests

      - name: Coverage report
        run: coverage report --precision=2

      - name: Coverage ratchet
        run: |
          current=$(coverage report --format=total --precision=2)
          python scripts/coverage_gate.py "$current" .github/coverage-baseline.txt
