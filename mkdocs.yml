site_name: corpus
site_description: Semantic search and structured query over your own content.
site_url: https://ryanjdillon.github.io/corpus/
repo_url: https://github.com/ryanjdillon/corpus
repo_name: ryanjdillon/corpus
edit_uri: edit/main/docs/
copyright: Corpus

theme:
  name: material
  custom_dir: overrides
  logo: assets/logos/logo_crest.svg
  favicon: assets/icons/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Architecture: architecture.html
  - Configuration: configuration.md
  - Sources:
      - Overview: fetchers/index.md
      - IMAP: fetchers/imap.md
      - Gmail: fetchers/gmail.md
      - Enrichment policy: fetchers/policy.md
  - Database: database.md
  - Observability: observability.md
  - Development: development.md
