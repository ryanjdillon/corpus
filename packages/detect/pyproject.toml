[project]
name = "corpus-detect"
version = "0.1.2"
description = "Deterministic PII and credential detection, and redaction built on it"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    # Pattern recognizers only; no spaCy model is loaded.
    "presidio-analyzer>=2.2",
    # Imported directly to validate emails against the bundled suffix list.
    "tldextract>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_detect"]
