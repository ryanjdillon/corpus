[project]
name = "corpus"
version = "0.3.0"
description = "Semantic search and structured query over content from pluggable sources"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "haystack-ai>=2.8",
    "pgvector-haystack>=1.2",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "imapclient>=3.0",
    "mail-parser>=4.1",
    # Enrichment schema + std-format (de)serialization; emits the JSON Schema that
    # guided decoding constrains against.
    "msgspec>=0.18",
    # Deterministic PII/secret detection (used pattern-only; no spaCy model loaded).
    "presidio-analyzer>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Pinned to the 1.x SDK: it ships FastMCP (mcp.server.fastmcp) with the
    # streamable-HTTP transport. 2.0 restructured the API and dropped that path.
    "mcp>=1.9,<2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    # scan-gate ext_proc server. grpcio is the runtime; protobuf is the
    # well-known-types runtime the vendored envoy/xds ext_proc stubs
    # (corpus/_ext_proc/) were generated against. The stubs are vendored rather
    # than pulled from xds-protos, whose wheel also ships a stale top-level
    # opentelemetry/proto that shadows opentelemetry-proto and breaks OTLP export.
    # Bounds track the gencode: grpcio>=1.74, protobuf 6.31+ (and <8 for otel).
    "grpcio>=1.74,<2",
    "protobuf>=6.31,<8",
    # OpenTelemetry: traces + metrics over OTLP to the cluster collector.
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "docker>=7.1",
]
dev = [
    # For the one-time Gmail OAuth helper (scripts/gmail_oauth.py).
    "google-auth-oauthlib>=1.2",
    # Pinned to match CI so `just check` catches exactly what CI does.
    "ruff==0.16.4",
]

[project.scripts]
corpus = "corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored, protoc-generated ext_proc stubs — not hand-maintained source.
extend-exclude = ["src/corpus/_ext_proc"]

[tool.coverage.run]
# The vendored generated stubs are executed on import but are not our code.
omit = ["src/corpus/_ext_proc/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests requiring Docker-backed services (run with -m integration)",
]
