{{- $root := . -}}
{{- range $name := keys .Values.networkPolicies | sortAlpha }}
{{- with index $root.Values.networkPolicies $name }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "corpus.labels" (dict "root" $root "component" "network") | nindent 4 }}
spec:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
